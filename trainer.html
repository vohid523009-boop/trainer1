<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер тренировок</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1b1b1f;--mu:#777;--ac:#e8590c;--ok:#2f9e44;--bd:#e3e3e8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1c1d21;--tx:#eee;--mu:#999;--bd:#2d2e33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111214;--card:#1c1d21;--tx:#eee;--mu:#999;--bd:#2d2e33;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:120px}
.w{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:17px}
.hint{color:var(--mu);font-size:13px;margin-bottom:8px}
.row{display:grid;grid-template-columns:24px 1fr 1fr 44px 32px;gap:6px;align-items:center;margin-bottom:6px}
.row.d input{opacity:.6}
input,select{width:100%;padding:10px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.n{color:var(--mu);text-align:center;font-size:14px}
.chk{height:40px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:8px;font-size:18px}
.row.d .chk{background:var(--ok);color:#fff;border-color:var(--ok)}
.x{background:none;border:0;color:var(--mu);font-size:18px}
.btn{padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;width:100%;margin-top:6px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.s{width:auto;padding:8px 12px;font-size:14px;margin:0}
.add{display:flex;gap:6px}.add input{flex:1}
.lab{font-size:12px;color:var(--mu);display:grid;grid-template-columns:24px 1fr 1fr 44px 32px;gap:6px;text-align:center;margin-bottom:2px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
#bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
#tm{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:90px}
#tm.over{color:var(--ok)}
#bar .sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
svg{width:100%;height:auto;display:block}
.h{display:flex;justify-content:space-between;gap:8px}
.mu{color:var(--mu);font-size:14px}
</style></head><body>
<div class="w">
<h1>🏋️ Трекер тренировок</h1>
<div class="tabs"><button data-t="w" class="on">Тренировка</button><button data-t="h">История</button><button data-t="p">Прогресс</button></div>
<div id="v"></div>
</div>
<div id="bar"><div class="in"><div id="tm">0:00</div><div class="mu" id="tl">отдых</div><div class="sp"></div>
<button class="btn s g" id="m15">−15</button><button class="btn s g" id="p15">+15</button><button class="btn s" id="sk">Стоп</button></div></div>
<script>
const K='trk_v1';
const X=(n,s,w,r,rest,note,rs)=>({n,s,w,r,rest,note,rs});
const DAY={'Верх А':'Пн','Низ А':'Ср','Верх Б':'Пт','Низ Б':'Сб'};
const TPL={'Верх А':[X('Жим штанги лёжа',4,102.5,8,150,'Разминка: 60×10, 80×6'),X('Подтягивания',4,0,12,120,'Цель: 14, 13, 12, 12',[14,13,12,12]),X('Жим гантелей сидя',3,25,10,90),X('Тяга Т-грифа',3,45,10,90),X('Махи гантелями в стороны',3,8,15,45,'Без дропсетов'),X('Подъём штанги на бицепс',3,27.5,10,60,'Отдых 45–60 с'),X('Французский жим лёжа',3,30,10,60,'Отдых 45–60 с')],
'Низ А':[X('Приседания со штангой',4,67.5,8,150,'При боли → 65 кг'),X('Румынская тяга',3,65,10,90),X('Жим ногами',3,120,12,90),X('Икры стоя',4,50,15,45),X('Подъём ног в висе',3,0,12,45,'Цель: 13, 13, 12',[13,13,12]),X('Планка',3,0,60,45,'Время в секундах: 60, 60, 75',[60,60,75])],
'Верх Б':[X('Жим гантелей на наклонной 30°',4,27.5,10,120),X('Тяга верхнего блока',4,59,12,120),X('Отжимания на брусьях',3,15,10,90,'Доп. вес +15–20 кг, 10–12 повторов'),X('Тяга горизонтального блока',3,62.5,12,90),X('Махи в стороны в наклоне',3,8,15,45,'Выдох на подъёме'),X('Молотки с гантелями',3,17.5,12,60,'Отдых 45–60 с'),X('Разгибания рук на блоке',3,45,12,60,'Отдых 45–60 с')],
'Низ Б':[X('Становая тяга',4,'',5,150,'+5–10 кг к прошлому весу, пояс обязателен'),X('Выпады с гантелями',3,'',10,90,'На ногу, +2 кг. Колени за носок НЕ выходят'),X('Румынская тяга',3,65,10,90,'Как в Низ А'),X('Икры в тренажёре',4,'',15,45,'+5–10 кг к прошлому'),X('Скручивания с весом',3,2.5,15,45),X('Боковая планка',3,0,45,45,'Время в секундах, +5 с к прошлому')]};
const def=()=>({sessions:[],cur:null,custom:[],rest:90,tab:'w',pex:''});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
if(S.cur&&['Верх A','Верх B','Низ'].includes(S.cur.name)&&!S.cur.ex.some(e=>e.sets.some(s=>s.done)))S.cur=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const allEx=()=>[...new Set([...Object.values(TPL).flat().map(x=>x.n),...S.custom,...S.sessions.flatMap(s=>s.ex.map(e=>e.name))])].sort();
const fmt=t=>Math.floor(t/60)+':'+String(Math.abs(t)%60).padStart(2,'0');
const dt=ts=>new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
function last(name){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].ex.find(x=>x.name===name);if(e&&e.sets.length)return e.sets}return null}
function newSet(e){const p=e.sets[e.sets.length-1];if(p)return{w:p.w,r:p.r,done:false};const l=last(e.name);const q=l&&l[0];return{w:q?q.w:'',r:q?q.r:'',done:false}}
function start(name){S.cur={id:Date.now(),ts:Date.now(),name,lastT:null,ex:(TPL[name]||[]).map(x=>({name:x.n,pl:1,rest:x.rest,note:x.note,tg:x.s+' × '+x.r+(x.w?' · '+x.w+' кг':''),sets:Array.from({length:x.s},(_,i)=>({w:x.w,r:x.rs?x.rs[i]:x.r,done:false}))}))};save();render()}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
({w:rW,h:rH,p:rP})[S.tab]()}
function rW(){const v=$('#v');
if(!S.cur){v.innerHTML='<div class="card"><h3>Начать тренировку</h3><div class="hint">Выбери шаблон — упражнения подставятся сами, их можно менять</div>'+
Object.keys(TPL).map(k=>`<button class="btn g" data-s="${k}">${DAY[k]} · ${k}</button>`).join('')+'<button class="btn g" data-s="Своя">Пустая тренировка</button></div><div class="card"><h3>Неделя 3 — пик (26–31 окт)</h3><div class="hint">Самая тяжёлая неделя: техника важнее веса. Овсянка + банан за 40–60 мин до тренировки · отдых Вт, Чт, Вс · сон 8 часов · после тренировки 10 мин бега или скакалки · при боли в коленях или пояснице сразу снижай вес.</div></div>'+restChips();
v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>start(b.dataset.s));bindChips();return}
const c=S.cur;
v.innerHTML=`<div class="h"><b>${esc(c.name)} · ${dt(c.ts)}</b><span class="mu">обычный отдых: ${fmt(S.rest)}</span></div>`+restChips()+
c.ex.map((e,i)=>{const l=last(e.name);return `<div class="card"><div class="h"><h3>${esc(e.name)}</h3><button class="x" data-rm="${i}">🗑</button></div>
<div class="hint">${e.tg?'<b>План: '+e.tg+' · отдых '+fmt(e.rest)+'</b>'+(e.note?'<br>'+esc(e.note):'')+'<br>':''}${l?'Прошлый раз: '+l.map(s=>s.w+'×'+s.r).join(', '):'Пока нет истории'}</div>
<div class="lab"><span>#</span><span>кг</span><span>повт.</span><span></span><span></span></div>`+
e.sets.map((s,j)=>`<div class="row ${s.done?'d':''}"><span class="n">${j+1}</span>
<input type="number" inputmode="decimal" step="0.5" value="${s.w}" data-i="${i}" data-j="${j}" data-f="w" placeholder="кг">
<input type="number" inputmode="numeric" value="${s.r}" data-i="${i}" data-j="${j}" data-f="r" placeholder="раз">
<button class="chk" data-ck="${i},${j}">✓</button><button class="x" data-ds="${i},${j}">✕</button></div>`).join('')+
`<button class="btn g" data-as="${i}">+ Подход</button></div>`}).join('')+
`<div class="card"><div class="add"><input list="dl" id="nx" placeholder="Добавить упражнение"><button class="btn s" id="ax">+</button></div><datalist id="dl">${allEx().map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
<button class="btn" id="fin">Завершить тренировку</button><button class="btn g" id="can">Отменить</button>`;
bindChips();
v.querySelectorAll('input[data-f]').forEach(x=>x.oninput=()=>{c.ex[x.dataset.i].sets[x.dataset.j][x.dataset.f]=x.value;save()});
v.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{const[i,j]=b.dataset.ck.split(',');const s=c.ex[i].sets[j];
if(s.done){s.done=false;delete s.rest}else{s.done=true;const n=Date.now();s.t=n;if(c.lastT)s.rest=Math.round((n-c.lastT)/1000);c.lastT=n;
const e=c.ex[i];startT(e.rest||S.rest);if(!e.pl&&+j===e.sets.length-1&&(s.w!==''||s.r!==''))e.sets.push(newSet(e))}save();rW()});
v.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{const[i,j]=b.dataset.ds.split(',');c.ex[i].sets.splice(j,1);save();rW()});
v.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{const e=c.ex[b.dataset.as];e.sets.push(newSet(e));save();rW()});
v.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{c.ex.splice(b.dataset.rm,1);save();rW()});
$('#ax').onclick=()=>{const n=$('#nx').value.trim();if(!n)return;if(!allEx().includes(n))S.custom.push(n);const e={name:n,sets:[]};e.sets.push(newSet(e));c.ex.push(e);save();rW()};
$('#fin').onclick=()=>{const ex=c.ex.map(e=>({name:e.name,sets:e.sets.filter(s=>s.done).map(s=>({w:+s.w||0,r:+s.r||0,rest:s.rest||null}))})).filter(e=>e.sets.length);
if(!ex.length){$('#fin').textContent='Сначала отметь хотя бы один подход ✓';return}
S.sessions.push({id:c.id,ts:c.ts,end:Date.now(),name:c.name,ex});S.cur=null;stopT();S.tab='h';save();render()};
$('#can').onclick=function(){twice(this,'Точно отменить? Нажми ещё раз',()=>{S.cur=null;stopT();save();render()})}}
function restChips(){return '<div class="chips">'+[60,90,120,180].map(x=>`<button data-r="${x}" class="${S.rest===x?'on':''}">${fmt(x)}</button>`).join('')+'</div>'}
function bindChips(){document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.rest=+b.dataset.r;save();render()})}
function rH(){const v=$('#v');if(!S.sessions.length){v.innerHTML='<div class="card mu">Пока нет сохранённых тренировок</div>';return}
v.innerHTML=S.sessions.slice().reverse().map(s=>{const vol=s.ex.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+x.w*x.r,0),0);const mins=s.end?Math.round((s.end-s.ts)/60000):null;
return `<div class="card"><div class="h"><h3>${esc(s.name)}</h3><span class="mu">${dt(s.ts)}</span></div>
<div class="hint">Объём: ${Math.round(vol)} кг${mins?' · '+mins+' мин':''}</div>`+
s.ex.map(e=>{const r=e.sets.map(x=>x.rest).filter(Boolean);const a=r.length?Math.round(r.reduce((p,q)=>p+q,0)/r.length):0;
return `<div><b>${esc(e.name)}</b><div class="mu">${e.sets.map(x=>x.w+'×'+x.r).join(' · ')}${a?' · отдых ≈ '+fmt(a):''}</div></div>`}).join('')+
`<button class="btn g s" data-del="${s.id}" style="margin-top:8px">Удалить</button></div>`}).join('');
v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>twice(b,'Точно? Нажми ещё раз',()=>{S.sessions=S.sessions.filter(s=>s.id!=b.dataset.del);save();rH()}))}
function rP(){const v=$('#v');const names=[...new Set(S.sessions.flatMap(s=>s.ex.map(e=>e.name)))].sort();
if(!names.length){v.innerHTML='<div class="card mu">Сохрани первую тренировку — здесь появятся графики прогресса</div>';return}
if(!names.includes(S.pex))S.pex=names[0];
const pts=S.sessions.map(s=>{const e=s.ex.find(x=>x.name===S.pex);if(!e)return null;return{ts:s.ts,w:Math.max(...e.sets.map(x=>x.w)),vol:e.sets.reduce((a,x)=>a+x.w*x.r,0)}}).filter(Boolean);
v.innerHTML=`<div class="card"><select id="ps">${names.map(n=>`<option ${n===S.pex?'selected':''}>${esc(n)}</option>`).join('')}</select>
<div class="hint" style="margin-top:10px">Максимальный вес по тренировкам, кг</div>${chart(pts.map(p=>p.w))}
<div class="hint" style="margin-top:10px">Объём (кг × повторы)</div>${chart(pts.map(p=>p.vol))}
<div class="mu">${pts.map(p=>dt(p.ts)+': '+p.w+' кг').join('<br>')}</div></div>`;
$('#ps').onchange=e=>{S.pex=e.target.value;save();rP()}}
function chart(a){const W=320,H=120,p=14;if(a.length<2)return '<div class="mu">Нужно минимум 2 тренировки для графика</div>';
const mx=Math.max(...a),mn=Math.min(...a),r=(mx-mn)||1;
const pt=a.map((y,i)=>[p+i*(W-2*p)/(a.length-1),H-p-(y-mn)/r*(H-2*p)]);
return `<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="#e8590c" stroke-width="2.5" points="${pt.map(q=>q.join(',')).join(' ')}"/>${pt.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#e8590c"/><text x="${q[0]}" y="${q[1]-8}" font-size="10" text-anchor="middle" fill="currentColor">${Math.round(a[i])}</text>`).join('')}</svg>`}
function twice(b,t,fn){if(b.dataset.a){fn();return}b.dataset.a=1;const o=b.textContent;b.textContent=t;setTimeout(()=>{delete b.dataset.a;b.textContent=o},3000)}
// timer
let end=0,iv=null,total=0;
function startT(sec){total=sec;end=Date.now()+sec*1000;$('#bar').style.display='block';clearInterval(iv);iv=setInterval(tick,250);tick()}
function stopT(){clearInterval(iv);$('#bar').style.display='none'}
let beeped=false;
function tick(){const left=Math.round((end-Date.now())/1000);const el=$('#tm');
if(left>=0){el.textContent=fmt(left);el.className='';$('#tl').textContent='отдых';beeped=false}
else{el.textContent='+'+fmt(-left);el.className='over';$('#tl').textContent='можно работать';
if(!beeped){beeped=true;try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}
try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),350)}catch(e){}}}}
$('#m15').onclick=()=>{end-=15000;tick()};$('#p15').onclick=()=>{end+=15000;tick()};$('#sk').onclick=stopT;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();render()});
render();
</script></body></html>
